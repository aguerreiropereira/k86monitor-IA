name: Build native installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.2.0)
        required: false
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-psutil
            mingw-w64-ucrt-x86_64-python-hid
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pyinstaller
      - name: Build application bundle
        run: pyinstaller packaging/k86-display-studio.spec --noconfirm --clean --distpath dist
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: powershell
        env:
          K86_VERSION: ${{ inputs.version || '1.0.0' }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:K86_VERSION = $env:GITHUB_REF_NAME.Substring(1) }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DK86_VERSION=$env:K86_VERSION" packaging/windows-installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: K86DisplayStudio-Windows-x64
          path: dist/K86DisplayStudio-*-Windows-x64-Setup.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK runtime and Python
        run: |
          brew install python gtk4 libadwaita pygobject3 hidapi
          echo "$(brew --prefix python)/bin" >> "$GITHUB_PATH"
      - name: Build macOS disk image
        env:
          K86_VERSION: ${{ inputs.version || '1.0.0' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then K86_VERSION="${GITHUB_REF_NAME#v}"; fi
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt
          packaging/build_macos.sh "$K86_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: K86DisplayStudio-macOS-arm64
          path: dist/K86DisplayStudio-*-macOS-arm64.dmg
          if-no-files-found: error

  macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK runtime and Python
        run: |
          brew install python gtk4 libadwaita pygobject3 hidapi
          echo "$(brew --prefix python)/bin" >> "$GITHUB_PATH"
      - name: Build macOS disk image
        env:
          K86_VERSION: ${{ inputs.version || '1.0.0' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then K86_VERSION="${GITHUB_REF_NAME#v}"; fi
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt
          packaging/build_macos.sh "$K86_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: K86DisplayStudio-macOS-x64
          path: dist/K86DisplayStudio-*-macOS-x86_64.dmg
          if-no-files-found: error

  publish-release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
